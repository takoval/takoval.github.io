<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taras Karabas: games</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #1f1d1a; --muted: #6b665d; --link: #8a3b12; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c22; --fg: #ece8df; --muted: #a39d92; --link: #e0a46e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 16px 0; border-top: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); }
  li strong { display: block; font-size: 1.1rem; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Taras Karabas</h1>
  <p class="sub">Board and card games for Android and iPhone.</p>
  <ul>
    <li><strong>Black Council</strong> A hidden-role card game at the Cossack council of 1663.
      <a href="https://sites.google.com/view/black-council-game">Privacy policy</a></li>
    <li><strong>Grazhda: Carpathian Tiles</strong>
      <a href="https://sites.google.com/view/grazhda-game">Privacy policy</a></li>
    <li><strong>Polonyna: Highland Board Game</strong>
      <a href="https://sites.google.com/view/polonyna">Privacy policy</a></li>
  </ul>
</main>
</body>
</html>
